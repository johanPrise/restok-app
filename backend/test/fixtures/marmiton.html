            "recipeIngredient": [
                "1 poulet coup\u00e9 en morceaux",
                "3 foie de volaille",
                "100 g de miel",
                "1 bouteille de vin blanc sec",
                "6 \u00e9chalotes",
                "3 gousses d'ail",
                "1 cuill\u00e8re \u00e0 soupe de vinaigre (de vin blanc)",
                "50 g de beurre",
                "poivre",
                "sel"
            ],
            "recipeInstructions": [
                {
                    "@type": "HowToStep",
                    "text": "Faites fondre le beurre dans une cocotte et faites revenir les morceaux de poulet de toutes parts jusqu'\u00e0 ce qu\u2019ils soient bien dor\u00e9s."
                },
                {
                    "@type": "HowToStep",
                    "text": "Mouillez alors avec la moiti\u00e9 du vin blanc puis ajoutez l\u2019eau n\u00e9cessaire pour couvrir le poulet."
                },
                {
                    "@type": "HowToStep",
                    "text": "Salez, poivrez et laissez cuire doucement 1 heure."
                },
                {
                    "@type": "HowToStep",
                    "text": "Pelez les \u00e9chalotes et l\u2019ail, coupez les foies de volaille en morceaux et mixez finement en pur\u00e9e."
                },
                {
                    "@type": "HowToStep",
                    "text": "Mettez cette pur\u00e9e dans une casserole, ajoutez le vin blanc restant, salez, poivrez et laissez cuire \u00e0 feu doux et \u00e0 couvert 30 min."
                },
                {
                    "@type": "HowToStep",
                    "text": "D\u00e9couvrez et poursuivez la cuisson encore 15 min."
                },
                {
                    "@type": "HowToStep",
                    "text": "Mettez le miel et le vinaigre dans une petite casserole et laissez cuire \u00e0 petits bouillons jusqu\u2019\u00e0 ce que le m\u00e9lange commence \u00e0 dorer l\u00e9g\u00e8rement. Ajoutez \u00e0 la pr\u00e9paration pr\u00e9c\u00e9dente."
                },
                {
                    "@type": "HowToStep",
                    "text": "Disposez les morceaux de poulet sur un plat de service et nappez-les de sauce."
                },
                {
                    "@type": "HowToStep",
                    "text": "Servez avec des tagliatelles fra\u00eeches."
                }
